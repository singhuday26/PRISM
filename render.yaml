services:
  - type: web
    name: prism-api
    runtime: python
    repo: https://github.com/singhuday26/PRISM.git
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: MONGO_URI
        sync: false  # Set manually in Render dashboard
      - key: DB_NAME
        value: prism_db
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_CORS
        value: "true"
      - key: CORS_ORIGINS
        value: "https://prism-five-mauve.vercel.app,https://singhuday26-prism.hf.space,https://prism.vercel.app"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health/ping
